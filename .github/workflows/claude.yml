name: Claude Code

# Claude reagiert auf Erwähnungen von @claude in Issues, Kommentaren und Reviews.
# Zusätzlich zur eingebauten Prüfung (nur Nutzer mit Schreibrechten) reagiert
# dieser Workflow ausschließlich auf den Repository-Besitzer.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment'
        && contains(github.event.comment.body, '@claude')
        && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review_comment'
        && contains(github.event.comment.body, '@claude')
        && github.event.comment.author_association == 'OWNER') ||
      (github.event_name == 'pull_request_review'
        && contains(github.event.review.body, '@claude')
        && github.event.review.author_association == 'OWNER') ||
      (github.event_name == 'issues'
        && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))
        && github.event.issue.author_association == 'OWNER')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Claude Code ausführen
        uses: anthropics/claude-code-action@v1
        with:
          # Variante A: Claude-Abo (Pro oder Max). Token lokal mit `claude setup-token` erzeugen.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Variante B: API-Schlüssel. Dann Zeile oben auskommentieren und diese aktivieren.
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          claude_args: |
            --max-turns 40
