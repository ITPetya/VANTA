name: App Build

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths: ["app/**", ".github/workflows/app-build.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-build.yml"]

permissions:
  contents: read

env:
  # Öffentliche Bundle-ID der App. Keine geheime Angabe, sie steht ohnehin in jeder .ipa.
  BUNDLE_ID: io.github.itpetya.vanta

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild archive \
            -project VANTA.xcodeproj \
            -scheme VANTA \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/VANTA.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/VANTA.xcarchive/Products/Applications/VANTA.app build/Payload/
          cd build && zip -qr VANTA.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VANTA-ipa
          path: app/build/VANTA.ipa
          if-no-files-found: error

      # Nur bei main: Release mit .ipa und SideStore-Quelle (source.json) veröffentlichen.
      # Die Quelle ist dauerhaft erreichbar unter
      # https://github.com/<owner>/<repo>/releases/latest/download/source.json
      - name: Release für SideStore veröffentlichen
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^ *MARKETING_VERSION: *"?([0-9.]+)"?.*/\1/p' project.yml | head -1)
          TAG="app-v${VERSION}-${BUILD}"
          SIZE=$(stat -f%z build/VANTA.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          python3 ../.github/scripts/make_source.py \
            --repo "$REPO" --tag "$TAG" --version "$VERSION" --build "$BUILD" \
            --bundle-id "$BUNDLE_ID" --size "$SIZE" --date "$DATE" \
            --out build/source.json
          gh release create "$TAG" build/VANTA.ipa build/source.json \
            --repo "$REPO" \
            --title "VANTA App ${VERSION} (Build ${BUILD})" \
            --notes "Automatischer Build von ${GITHUB_SHA}. Installation und Updates über SideStore, siehe docs/APP.md." \
            --latest
