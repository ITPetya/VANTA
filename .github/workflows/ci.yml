name: CI

# Läuft bei jedem Pull Request und zusätzlich bei Pushes auf Claude-Branches.
# Der Push-Auslöser ist nötig, weil Pull Requests, die automatisch per
# GITHUB_TOKEN erstellt werden, keine weiteren Workflows auslösen.

on:
  pull_request:
  push:
    branches:
      - "claude/**"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    # Wegwerf-Datenbank nur für die Tests. Die Tests löschen das Schema "public".
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: vanta_test
          POSTGRES_PASSWORD: vanta_test_only
          POSTGRES_DB: vanta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vanta_test -d vanta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      VANTA_TEST_DATABASE_URL: postgresql+psycopg://vanta_test:vanta_test_only@localhost:5432/vanta_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy
      - name: pytest
        run: pytest
